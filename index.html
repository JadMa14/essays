<!DOCTYPE html>
<html>
<head>
<title>essays</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<style>
html, body {
  background-color: #ffffff !important;
  color: #000000 !important;
}
body {
  font-family: Georgia, 'Times New Roman', Times, serif;
  font-size: 18px;
  margin: 0;
  padding: 0;
  color-scheme: light only;
}
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 10vw;
  height: 100%;
  background: linear-gradient(180deg, #a8c6a0, #7da672);
}
.container {
  max-width: 500px;
  margin: 0;
  padding: 40px 40px 40px calc(10vw + 40px);
}
h1 {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 20px;
  color: #1a1a4e;
  font-variant: small-caps;
}
.watermark {
  font-size: 40px;
  font-weight: bold;
  color: rgba(0, 0, 0, 0.12);
  margin: 0 0 -8px -2px;
  line-height: 1;
}
.essay-list {
  list-style: square;
  padding: 0 0 0 20px;
  margin: 0;
}
.essay-list li {
  margin-bottom: 4px;
  line-height: 1.5;
  font-size: 16px;
  color: #555;
}
.essay-list a {
  color: #0066cc;
  text-decoration: underline;
}
@media (max-width: 600px) {
  .sidebar {
    display: none;
  }
  .container {
    padding: 24px 20px;
    max-width: 100%;
  }
  .watermark {
    font-size: 28px;
  }
}
</style>
</head>
<body>

<div class="sidebar"></div>
<div class="container">
  <div class="watermark">Jad Malaeb</div>
  <h1>essays</h1>

  <ul class="essay-list">
    <li><a href="being-good.html">Being Good</a></li>
  </ul>
</div>

</body>
</html>
